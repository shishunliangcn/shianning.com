<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>史顺良的个人主页</title>
    <style>
        /* 基础设置：铺满全屏，深色渐变背景 */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f, #0f0f15);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* 核心卡片：毛玻璃效果 */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease;
        }

        /* 鼠标悬浮时轻微上浮 */
        .card:hover {
            transform: translateY(-5px);
        }

        /* 头像样式：圆形带发光边框 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
            margin-bottom: 20px;
            transition: box-shadow 0.3s ease;
        }

        .avatar:hover {
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.6);
        }

        /* 文字排版 */
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            margin: 0 0 30px 0;
            color: #a0a0b0;
            font-size: 15px;
            line-height: 1.6;
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #4da6ff; /* 鼠标移上去变成好看的蓝色 */
            color: #ffffff;
            box-shadow: 0 0 15px rgba(77, 166, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 这里引用了你仓库里的图片，确保文件名拼写一致 -->
        <img src="shishunliang.png" alt="史顺良" class="avatar">
        
        <h1>史顺良</h1>
        <p>欢迎来到我的个人专属空间<br>Hello World, this is my digital garden.</p>
        
        <!-- 跳转到你的 GitHub 主页 -->
        <a href="https://github.com/shishunliangcn" target="_blank" class="btn">我的 GitHub</a>
    </div>

</body>
</html>
