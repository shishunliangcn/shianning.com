<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>史安宁的小学堂 · 从启蒙到大学</title>
  <meta name="description" content="史安宁的小学堂 —— 从启蒙到大学，经得起时间考验的线上学园。四个学段、十六门学科，按需取用。" />
  <meta name="theme-color" content="#fdfaf5" />
  <style>
    :root {
      --bg: #fdfaf5;
      --bg-soft: #f7f0e6;
      --ink: #2b2a26;
      --ink-2: #6b665c;
      --teal: #0f766e;
      --teal-deep: #0b5d56;
      --sky: #0ea5e9;
      --line: #ece2d4;
      --card: #fffdfa;
      --shadow-sm: 0 1px 2px rgba(43, 42, 38, .05), 0 6px 18px rgba(43, 42, 38, .05);
      --shadow-lg: 0 14px 36px rgba(43, 42, 38, .12);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* 背景光斑 */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .blob {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .5;
    }
    .blob--a {
      width: 46vw; height: 46vw;
      min-width: 320px; min-height: 320px;
      top: -16vw; right: -10vw;
      background: radial-gradient(circle at 30% 30%, rgba(20, 184, 166, .38), rgba(20, 184, 166, 0));
    }
    .blob--b {
      width: 40vw; height: 40vw;
      min-width: 280px; min-height: 280px;
      bottom: -18vw; left: -12vw;
      background: radial-gradient(circle at 60% 40%, rgba(14, 165, 233, .26), rgba(14, 165, 233, 0));
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 26px 24px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--ink);
      text-decoration: none;
    }
    .brand::before {
      content: "学";
      display: grid;
      place-items: center;
      width: 30px; height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--teal), var(--sky));
      color: #fff;
      font-size: 15px;
      font-weight: 800;
    }

    .top nav a {
      font-size: 14px;
      color: var(--ink-2);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      transition: color .2s, background-color .2s;
    }
    .top nav a:hover { color: var(--teal); background: var(--bg-soft); }

    main {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 主视觉 */
    .hero {
      text-align: center;
      padding: clamp(48px, 9vw, 96px) 0 clamp(32px, 5vw, 52px);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 22px;
      padding: 6px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 250, .8);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--teal);
    }

    h1 {
      font-size: clamp(2.3rem, 6.4vw, 4rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: .01em;
      background: linear-gradient(120deg, #0f766e 20%, #0ea5e9 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      margin-top: 22px;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 600;
      color: var(--ink);
    }

    .sub {
      margin-top: 10px;
      font-size: 15px;
      color: var(--ink-2);
    }

    /* 学段卡片 */
    .stages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
      gap: 18px;
      margin-top: 8px;
    }

    .stage {
      --accent: var(--teal);
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      border-radius: var(--radius) 0 0 var(--radius);
      background: var(--accent);
      opacity: .85;
    }
    .stage:hover,
    .stage:focus-visible {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
      outline: none;
    }
    .stage:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

    .stage__icon {
      font-size: 30px;
      line-height: 1;
      flex: none;
    }

    .stage__body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .stage__name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .stage__meta {
      font-size: 12.5px;
      color: var(--ink-2);
    }

    .stage__arrow {
      margin-left: auto;
      font-size: 15px;
      color: var(--accent);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity .2s ease, transform .2s ease;
    }
    .stage:hover .stage__arrow,
    .stage:focus-visible .stage__arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* 主按钮 */
    .cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: clamp(34px, 6vw, 56px) 0 clamp(48px, 8vw, 80px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 42px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--teal), var(--teal-deep));
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(15, 118, 110, .28);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      filter: saturate(1.08);
      box-shadow: 0 16px 34px rgba(15, 118, 110, .34);
      outline: none;
    }
    .btn:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }

    .cta__hint {
      font-size: 13px;
      color: var(--ink-2);
    }

    footer {
      padding: 0 24px 30px;
      text-align: center;
      font-size: 12.5px;
      color: var(--ink-2);
    }

    @media (max-width: 640px) {
      .top { padding-top: 18px; }
      .stage { padding: 18px 16px; }
      .btn { width: 100%; justify-content: center; padding: 15px 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      .stage:hover { transform: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob--a"></span>
    <span class="blob blob--b"></span>
  </div>

  <header class="top">
    <a class="brand" href="/notes/">史安宁的小学堂</a>
    <nav>
      <a href="/notes/">知识库</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">从启蒙到大学 · 线上学园</p>
      <h1>史安宁的小学堂</h1>
      <p class="lead">从启蒙到大学，经得起时间考验的线上学园</p>
      <p class="sub">四个学段，二十九门学科。想从哪儿开始，就从哪儿开始。</p>
    </section>

    <section class="stages" aria-label="选择学段">
      <a class="stage" href="/notes/preschool/" style="--accent:#f59e0b">
        <span class="stage__icon" aria-hidden="true">👶</span>
        <span class="stage__body">
          <span class="stage__name">启蒙乐园</span>
          <span class="stage__meta">3–6 岁 · 玩中学</span>
        </span>
        <span class="stage__arrow" aria-hidden="true">→</span>
      </a>

      <a class="stage" href="/notes/primary/" style="--accent:#0d9488">
        <span class="stage__icon" aria-hidden="true">🎒</span>
        <span class="stage__body">
          <span class="stage__name">小学课堂</span>
          <span class="stage__meta">6–12 岁 · 打好底子</span>
        </span>
        <span class="stage__arrow" aria-hidden="true">→</span>
      </a>

      <a class="stage" href="/notes/middle/" style="--accent:#2563eb">
        <span class="stage__icon" aria-hidden="true">📚</span>
        <span class="stage__body">
          <span class="stage__name">中学冲刺</span>
          <span class="stage__meta">12–18 岁 · 系统梳理</span>
        </span>
        <span class="stage__arrow" aria-hidden="true">→</span>
      </a>

      <a class="stage" href="/notes/university/" style="--accent:#7c3aed">
        <span class="stage__icon" aria-hidden="true">🎓</span>
        <span class="stage__body">
          <span class="stage__name">大学殿堂</span>
          <span class="stage__meta">18 岁以上 · 建立框架</span>
        </span>
        <span class="stage__arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <div class="cta">
      <a class="btn" href="/notes/">📖 进入知识库全图</a>
      <p class="cta__hint">二十九门学科总览，随时取用</p>
    </div>
  </main>

  <footer>© 2026 史安宁的小学堂 · 从启蒙到大学，经得起时间考验</footer>
</body>
</html>
