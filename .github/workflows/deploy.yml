name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 走 gh-pages 分支发布：Pages 的 workflow 部署接口此前会卡死，
# 分支方式由 Pages 自己构建，稳定得多。
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build VitePress site
        run: npm run docs:build

      # 目录级校验，不依赖具体文章，新增内容不会让 CI 挂掉
      - name: Verify build output
        run: |
          test -f docs/.vitepress/dist/index.html
          test -f docs/.vitepress/dist/tags.html
          for dir in nature humanities logic arts life parenting; do
            test -d "docs/.vitepress/dist/$dir" || { echo "缺少目录 $dir"; exit 1; }
          done
          echo "构建产物检查通过"

      # 大门在根路径，知识库挂到 /notes/
      - name: Assemble site
        run: node scripts/assemble-site.mjs

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
