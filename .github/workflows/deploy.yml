name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Vue 单文件组件（.vue）由 Vite 在构建阶段编译，
      # 因此只要 npm ci + docs:build 通过，组件就会被正确打包。
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify build output
        run: |
          test -f docs/.vitepress/dist/index.html
          test -d docs/.vitepress/dist/nature
          test -f docs/.vitepress/dist/nature/astronomy/stars.html
          test -f docs/.vitepress/dist/life/safety-first-aid/burns.html
          test -f docs/.vitepress/dist/tags.html
          echo "构建产物检查通过"

      # 组装最终站点：旧主页在根路径，笔记站挂到 /notes/
      - name: Assemble site
        run: |
          mkdir -p _site/notes
          cp index.html _site/index.html
          cp CNAME _site/CNAME
          cp -R docs/.vitepress/dist/. _site/notes/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
