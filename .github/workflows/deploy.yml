name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build VitePress site
        run: npm run docs:build

      # 目录级校验，不依赖具体文章，新增内容不会让 CI 挂掉
      - name: Verify build output
        run: |
          test -f docs/.vitepress/dist/index.html
          test -f docs/.vitepress/dist/tags.html
          for dir in nature humanities logic arts life parenting; do
            test -d "docs/.vitepress/dist/$dir" || { echo "缺少目录 $dir"; exit 1; }
          done
          echo "构建产物检查通过"

      # 大门在根路径，知识库挂到 /notes/
      - name: Assemble site
        run: node scripts/assemble-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
